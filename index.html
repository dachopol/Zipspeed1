function read(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
let lang=read('zip-language-v2',navigator.language.toLowerCase().startsWith('th')?'th':'en');if(!['th','en'].includes(lang))lang='th';
let theme=read('zip-theme-v2','dark');if(!['dark','light'].includes(theme))theme='dark';document.body.dataset.theme=theme;
let history=read('zip-history-v2',[]);history=Array.isArray(history)?history.filter(h=>h&&Number.isFinite(Date.parse(h.time))&&['down','up','ping','jitter'].every(k=>Number.isFinite(h[k])&&h[k]>=0)).slice(0,50):[];
let busy=false,controller=null,cancelReason='stopped',phaseKey='ready',statusKey='ready',progress=0;
const t=k=>D[k][lang==='th'?0:1];
function setStatus(k,error=false){statusKey=k;$('status').textContent=t(k);$('status').classList.toggle('error',error)}
function setPhase(k){phaseKey=k;$('phase').textContent=t(k)}
function network(){ $('network').textContent=t(navigator.onLine?'online':'offline') }
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('language').value=lang;$('phase').textContent=t(phaseKey);$('status').textContent=t(statusKey);network();renderHistory()}
function renderHistory(){const list=$('historyList');list.replaceChildren();$('clear').disabled=history.length===0;if(!history.length){const p=document.createElement('p');p.className='note';p.textContent=t('empty');list.append(p);return}for(const h of history){const box=document.createElement('article');box.className='history-item';const time=document.createElement('time');time.dateTime=h.time;time.textContent=new Date(h.time).toLocaleString(lang==='th'?'th-TH':'en-GB');const p=document.createElement('p');p.textContent=`↓ ${h.down.toFixed(2)} / ↑ ${h.up.toFixed(2)} Mbps`;const sub=document.createElement('p');sub.className='note';sub.textContent=`HTTP latency ${h.ping.toFixed(1)} ms · Jitter ${h.jitter.toFixed(1)} ms · Score ${h.score??'—'}/100 · Stability ${h.stability??'—'}% · Cloudflare edge`;box.append(time,p,sub);list.append(box)}}
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.dataset.theme=theme;write('zip-theme-v2',theme)};
$('language').onchange=()=>{lang=$('language').value;write('zip-language-v2',lang);render()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{if(x===b)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});['speed','history','settings'].forEach(id=>$(id).hidden=id!==b.dataset.tab)});
$('clear').onclick=()=>{if(confirm(t('confirmClear'))){if(write('zip-history-v2',[])){history=[];renderHistory()}else setStatus('storage',true)}};
function cancel(reason='stopped'){if(busy){cancelReason=reason;controller.abort()}}
window.addEventListener('offline',()=>{network();cancel('networkChange')});window.addEventListener('online',network);navigator.connection?.addEventListener('change',()=>cancel('networkChange'));document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel('background')});
function median(a){const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function arc(){ $('arc').value=progress }
function setNeedle(mbps){const v=Number.isFinite(mbps)?Math.max(0,mbps):0;const angle=145+250*Math.min(1,Math.log1p(v)/Math.log(1001));$('needle').style.transform=`rotate(${angle}deg)`;}
// These endpoints are documented at https://github.com/cloudflare/speedtest.
// No external scripts, invented measurements, or location collection.
async function request(bytes,upload=false){
 const local=new AbortController();const signal=controller.signal;const abort=()=>local.abort();signal.addEventListener('abort',abort,{once:true});if(signal.aborted)abort();let timedOut=false;
 const timer=setTimeout(()=>{timedOut=true;local.abort()},15000);
 try{
  const url=new URL(upload?'https://speed.cloudflare.com/__up':'https://speed.cloudflare.com/__down');if(!upload)url.searchParams.set('bytes',String(bytes));url.searchParams.set('zip',String(Date.now())+'-'+String(progress));
  const options={method:upload?'POST':'GET',mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:local.signal};
  if(upload){const payload=new Uint8Array(bytes);for(let i=0;i<bytes;i+=65536)crypto.getRandomValues(payload.subarray(i,Math.min(bytes,i+65536)));options.body=payload}
  const start=performance.now();const response=await fetch(url,options);if(!response.ok)throw new Error('HTTP '+response.status);const body=await response.arrayBuffer();const elapsed=performance.now()-start;
  if(!upload&&body.byteLength!==bytes)throw new Error('Unexpected response size');if(!(elapsed>0))throw new Error('Invalid duration');return {bytes:upload?bytes:body.byteLength,ms:elapsed};
 }catch(e){if(timedOut&&!signal.aborted)throw new Error('timeout');throw e}finally{clearTimeout(timer);signal.removeEventListener('abort',abort)}
}
let liveSamples=[];
function drawSpark(){const c=$('spark'),x=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth||400,h=c.clientHeight||72;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);if(liveSamples.length<2)return;const max=Math.max(...liveSamples,1);x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent').trim();x.lineWidth=2;x.beginPath();liveSamples.forEach((v,i)=>{const px=i/(liveSamples.length-1)*w,py=h-6-(v/max)*(h-12);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function pushSample(v){liveSamples.push(v);if(liveSamples.length>30)liveSamples.shift();$('sampleCount').textContent=liveSamples.length;drawSpark()}
function assess(r){let score=100;score-=Math.min(30,Math.max(0,r.ping-30)*.35);score-=Math.min(25,r.jitter*.8);if(r.down<25)score-=Math.min(25,(25-r.down));if(r.up<5)score-=Math.min(20,(5-r.up)*3);score=Math.max(0,Math.round(score));const vals=liveSamples.slice(-6),avg=vals.reduce((a,b)=>a+b,0)/(vals.length||1),dev=vals.length?Math.sqrt(vals.reduce((a,b)=>a+(b-avg)**2,0)/vals.length):0,stab=Math.max(0,Math.round(100-(avg?dev/avg*100:0)));$('score').textContent=score+'/100';$('stability').textContent=stab+'%';$('quality').textContent=t(score>=80?'qualityGood':score>=55?'qualityFair':'qualityPoor');const issues=[];if(r.ping>100)issues.push(t('alertLatency'));if(r.jitter>30)issues.push(t('alertJitter'));if(r.down<10)issues.push(t('alertDownload'));if(r.up<2)issues.push(t('alertUpload'));const box=$('alertbox');box.textContent=issues.length?issues.join(' · '):t('noAlerts');box.className='alertbox '+(issues.length>1?'bad':issues.length?'warn':'');if(issues.length&&('Notification' in window)&&Notification.permission==='granted')new Notification('Zipspeed',{body:issues.join(' · ')}) ;return {score,stability:stab,issues}}
function downloadReport(type){if(!history.length){setStatus('ready');return}let blob,name;if(type==='json'){blob=new Blob([JSON.stringify({app:'Zipspeed',generatedAt:new Date().toISOString(),results:history},null,2)],{type:'application/json'});name='zipspeed-report.json'}else{const rows=[['time','download_mbps','upload_mbps','latency_ms','jitter_ms','score','stability'],...history.map(h=>[h.time,h.down,h.up,h.ping,h.jitter,h.score??'',h.stability??''])];blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});name='zipspeed-report.csv'}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('csv').onclick=()=>downloadReport('csv');$('json').onclick=()=>downloadReport('json');$('notify').onclick=async()=>{if(!('Notification'in window))return;const p=await Notification.requestPermission();if(p==='granted'){$('notify').textContent=t('notifyEnabled')}};window.addEventListener('resize',drawSpark);
async function throughput(sizes,phase,metric){setPhase(phase);setStatus(phase);$('unit').textContent='Mbps';let total=0,ms=0;for(const bytes of sizes){const r=await request(bytes,phase==='upload');total+=r.bytes;ms+=r.ms;const value=total*8/(ms*1000);$(metric).textContent=value.toFixed(2);$('number').textContent=value.toFixed(2);pushSample(value);setNeedle(value);progress++;arc()}return total*8/(ms*1000)}
$('start').onclick=async()=>{
 if(busy){cancel();return}if(!navigator.onLine){setStatus('offline',true);return}
 busy=true;controller=new AbortController();cancelReason='stopped';liveSamples=[];drawSpark();$('score').textContent='—';$('stability').textContent='—';$('sampleCount').textContent='0';$('quality').textContent='—';$('alertbox').textContent=t('noAlerts');$('alertbox').className='alertbox';$('start').textContent='STOP';$('start').dataset.running='true';$('start').setAttribute('aria-label',lang==='th'?'หยุดทดสอบ':'Stop test');setNeedle(0);progress=0;arc();for(const id of ['down','up','ping','jitter','number'])$(id).textContent='—';$('unit').textContent='ms';
 try{
  setPhase('warm');setStatus('warm');await request(0);progress++;arc();setPhase('latency');setStatus('latency');const samples=[];
  for(let i=0;i<7;i++){samples.push((await request(0)).ms);$('number').textContent=median(samples).toFixed(1);progress++;arc()}
  const ping=median(samples);const jitter=samples.slice(1).reduce((s,x,i)=>s+Math.abs(x-samples[i]),0)/(samples.length-1);$('ping').textContent=ping.toFixed(1);$('jitter').textContent=jitter.toFixed(1);
  const down=await throughput([1000000,4000000,8000000],'download','down');const up=await throughput([250000,1000000,2000000],'upload','up');if(controller.signal.aborted)throw new Error('cancelled');
  const result={time:new Date().toISOString(),down,up,ping,jitter};const a=assess(result);Object.assign(result,{score:a.score,stability:a.stability,issues:a.issues});history.unshift(result);history=history.slice(0,50);const saved=write('zip-history-v2',history);renderHistory();$('number').textContent=down.toFixed(2);setNeedle(down);setPhase('download');setStatus(saved?'complete':'storage',!saved);
 }catch(e){for(const id of ['down','up','ping','jitter','number'])$(id).textContent='—';progress=0;arc();setNeedle(0);setPhase('ready');setStatus(controller.signal.aborted?cancelReason:e.message==='timeout'?'timeout':'failed',true)}
 finally{busy=false;controller=null;$('start').textContent='GO';$('start').dataset.running='false';$('start').setAttribute('aria-label',lang==='th'?'เริ่มทดสอบ':'Start test')}
};
